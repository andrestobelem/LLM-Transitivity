<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Response explorer · LLM Transitivity</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f5f6f8;
        --surface: #ffffff;
        --surface-soft: #f0f2f5;
        --foreground: #18212f;
        --muted: #687384;
        --border: #dfe3e9;
        --accent: #4457d9;
        --yes: #13795b;
        --yes-soft: #e7f6ef;
        --no: #b5473f;
        --no-soft: #fceceb;
        --shadow: 0 10px 30px rgb(23 32 51 / 6%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: #12151b;
          --surface: #1a1f28;
          --surface-soft: #252c37;
          --foreground: #f1f4f8;
          --muted: #a6afbc;
          --border: #323a48;
          --accent: #a8b2ff;
          --yes: #66d6a5;
          --yes-soft: #183a2e;
          --no: #ff9b91;
          --no-soft: #492726;
          --shadow: 0 10px 30px rgb(0 0 0 / 18%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--foreground);
        background: var(--background);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 24px 0 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 48px;
      }

      .brand {
        color: var(--foreground);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-decoration: none;
      }

      .topbar-note {
        color: var(--muted);
        font-size: 13px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(250px, 340px);
        align-items: end;
        gap: 48px;
        padding-bottom: 34px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 660px;
        margin: 0;
        font-size: clamp(34px, 5vw, 62px);
        letter-spacing: -0.055em;
        line-height: 0.98;
      }

      .lede {
        max-width: 620px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 16px;
      }

      .distribution {
        padding-bottom: 3px;
      }

      .distribution-head,
      .distribution-key,
      .result-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .distribution-head {
        margin-bottom: 11px;
        font-size: 13px;
        font-weight: 700;
      }

      .distribution-total {
        color: var(--muted);
        font-weight: 500;
      }

      .distribution-track {
        display: flex;
        overflow: hidden;
        height: 14px;
        border-radius: 999px;
        background: var(--surface-soft);
      }

      .distribution-bar {
        min-width: 0;
        transition: width 180ms ease;
      }

      .distribution-bar--yes {
        background: var(--yes);
      }

      .distribution-bar--no {
        background: var(--no);
      }

      .distribution-key {
        justify-content: flex-start;
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .key-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .key-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .key-dot--yes {
        background: var(--yes);
      }

      .key-dot--no {
        background: var(--no);
      }

      .workspace {
        border-top: 1px solid var(--border);
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 22px 0 18px;
      }

      .search-field {
        display: flex;
        align-items: center;
        flex: 1 1 280px;
        max-width: 430px;
        min-width: 0;
        border-bottom: 1px solid var(--border);
      }

      .search-field span {
        color: var(--muted);
        font-size: 15px;
        line-height: 1;
      }

      .search-field input {
        width: 100%;
        min-width: 0;
        padding: 8px 10px;
        color: var(--foreground);
        background: transparent;
        border: 0;
        outline: 0;
      }

      .search-field input::placeholder {
        color: var(--muted);
      }

      .response-filters {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .filter-button {
        padding: 7px 10px;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        font-size: 13px;
      }

      .filter-button:hover,
      .filter-button:focus-visible,
      .filter-button[aria-pressed="true"] {
        color: var(--foreground);
        border-color: var(--border);
        outline: 0;
      }

      .filter-button[aria-pressed="true"] {
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .filter-count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .result-meta {
        justify-content: flex-start;
        padding: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .case-list {
        display: grid;
        gap: 10px;
      }

      .case-row {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 94px;
        gap: 20px;
        align-items: start;
        padding: 24px 26px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      .case-id {
        padding-top: 2px;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .case-content {
        min-width: 0;
      }

      .case-label {
        margin: 0 0 9px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .prompt-text {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.012em;
      }

      .response-column {
        justify-self: end;
        text-align: right;
      }

      .response-label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .response-value {
        font-size: 23px;
        font-weight: 850;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .response-value--yes {
        color: var(--yes);
      }

      .response-value--no {
        color: var(--no);
      }

      .metadata {
        margin-top: 17px;
        border-top: 1px solid var(--border);
      }

      .metadata summary {
        display: inline-flex;
        padding-top: 13px;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        list-style-position: inside;
      }

      .metadata summary:hover,
      .metadata summary:focus-visible {
        color: var(--foreground);
      }

      .metadata-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin: 16px 0 0;
      }

      .metadata-grid div {
        min-width: 0;
      }

      .metadata-grid dt {
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 11px;
      }

      .metadata-grid dd {
        overflow-wrap: anywhere;
        margin: 0;
        font-size: 12px;
      }

      .raw-response {
        margin-top: 16px;
      }

      .raw-response summary {
        padding-top: 0;
      }

      .raw-response pre {
        max-height: 320px;
        overflow: auto;
        margin: 12px 0 0;
        padding: 14px;
        color: var(--muted);
        background: var(--surface-soft);
        border-radius: 8px;
        font-size: 11px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .empty-state,
      .loading-state {
        padding: 64px 24px;
        color: var(--muted);
        text-align: center;
      }

      .empty-state h2 {
        margin: 0 0 8px;
        color: var(--foreground);
        font-size: 20px;
      }

      .empty-state p {
        max-width: 520px;
        margin: 8px auto;
      }

      .empty-state code {
        display: inline-block;
        margin-top: 8px;
        padding: 7px 9px;
        color: var(--foreground);
        background: var(--surface-soft);
        border-radius: 6px;
        font-size: 12px;
      }

      .file-picker {
        display: inline-block;
        margin-top: 16px;
        padding: 9px 13px;
        color: var(--foreground);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }

      .file-picker:hover {
        border-color: var(--accent);
      }

      .file-picker input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      @media (max-width: 760px) {
        .app-shell {
          width: min(100% - 28px, 680px);
          padding-top: 16px;
        }

        .topbar {
          padding-bottom: 36px;
        }

        .topbar-note {
          display: none;
        }

        .hero {
          grid-template-columns: 1fr;
          gap: 30px;
        }

        .controls {
          align-items: stretch;
          flex-direction: column;
          gap: 15px;
        }

        .search-field {
          flex: 0 1 auto;
          max-width: none;
        }

        .response-filters {
          justify-content: space-between;
        }

        .filter-button {
          flex: 1;
        }

        .case-row {
          grid-template-columns: 34px minmax(0, 1fr);
          gap: 13px;
          padding: 20px 18px;
        }

        .response-column {
          grid-column: 2;
          justify-self: start;
          margin-top: 8px;
          text-align: left;
        }

        .metadata-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 430px) {
        .prompt-text {
          font-size: 16px;
        }

        .metadata-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="../README.md">LLM Transitivity</a>
        <span class="topbar-note">Hypothetical syllogism benchmark</span>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <div>
            <p class="eyebrow">Response explorer</p>
            <h1 id="page-title">What did the model answer?</h1>
            <p class="lede">
              Read each syllogism and compare it with the model response. Technical details
              stay hidden until needed.
            </p>
          </div>

          <div class="distribution" aria-label="Response distribution">
            <div class="distribution-head">
              <span>Response distribution</span>
              <span id="distributionTotal" class="distribution-total">Loading…</span>
            </div>
            <div class="distribution-track" aria-hidden="true">
              <div id="yesBar" class="distribution-bar distribution-bar--yes"></div>
              <div id="noBar" class="distribution-bar distribution-bar--no"></div>
            </div>
            <div class="distribution-key">
              <span class="key-item"><span class="key-dot key-dot--yes"></span><span id="yesLegend">Yes</span></span>
              <span class="key-item"><span class="key-dot key-dot--no"></span><span id="noLegend">No</span></span>
            </div>
          </div>
        </section>

        <section class="workspace" aria-label="Benchmark responses">
          <div class="controls">
            <label class="search-field">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="Search the prompts" autocomplete="off" />
            </label>
            <div class="response-filters" role="group" aria-label="Filter by response">
              <button class="filter-button" type="button" data-response-filter="all" aria-pressed="true">
                All <span class="filter-count" data-filter-count="all">—</span>
              </button>
              <button class="filter-button" type="button" data-response-filter="yes" aria-pressed="false">
                Yes <span class="filter-count" data-filter-count="yes">—</span>
              </button>
              <button class="filter-button" type="button" data-response-filter="no" aria-pressed="false">
                No <span class="filter-count" data-filter-count="no">—</span>
              </button>
            </div>
          </div>

          <div id="resultMeta" class="result-meta" aria-live="polite">Loading results…</div>
          <div id="results" class="case-list" aria-live="polite">
            <div class="loading-state">Loading results…</div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const CASE_IDS = Array.from({ length: 57 }, (_, index) => index + 1);
      const DATA_ROOT = "../data";
      const state = {
        cases: [],
        response: "all",
        query: "",
      };

      const results = document.getElementById("results");
      const resultMeta = document.getElementById("resultMeta");
      const searchInput = document.getElementById("searchInput");
      const distributionTotal = document.getElementById("distributionTotal");
      const yesBar = document.getElementById("yesBar");
      const noBar = document.getElementById("noBar");
      const yesLegend = document.getElementById("yesLegend");
      const noLegend = document.getElementById("noLegend");
      const filterButtons = [...document.querySelectorAll("[data-response-filter]")];

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatCost(value) {
        if (typeof value !== "number") return "—";
        return `$${value.toFixed(6)}`;
      }

      function normalizeCase(raw, id) {
        const response = String(raw.responses ?? "").trim().toLowerCase();
        const usage = raw.usage ?? {};
        const apiResponse = raw.raw_response ?? {};
        const choice = apiResponse.choices?.[0] ?? {};

        return {
          id,
          prompt: String(raw.user_prompt ?? ""),
          response,
          systemPrompt: String(raw.system_prompt ?? ""),
          model: String(raw.model ?? apiResponse.model ?? "—"),
          finishReason: String(choice.finish_reason ?? "—"),
          totalTokens: usage.total_tokens,
          promptTokens: usage.prompt_tokens,
          completionTokens: usage.completion_tokens,
          cost: usage.cost,
          raw: raw.raw_response,
        };
      }

      async function loadFromRepository() {
        const loaded = await Promise.all(
          CASE_IDS.map(async (id) => {
            const response = await fetch(`${DATA_ROOT}/${id}_HS.json`, { cache: "no-store" });
            if (!response.ok) throw new Error(`Could not load ${id}_HS.json`);
            return normalizeCase(await response.json(), id);
          }),
        );
        return loaded.sort((left, right) => left.id - right.id);
      }

      async function loadFromFiles(fileList) {
        const files = [...fileList]
          .filter((file) => /(?:^|\/)\d+_HS\.json$/i.test(file.webkitRelativePath || file.name))
          .sort((left, right) => left.name.localeCompare(right.name, undefined, { numeric: true }));
        return Promise.all(
          files.map(async (file) => {
            const match = file.name.match(/^(\d+)_HS\.json$/i);
            return normalizeCase(await file.text().then(JSON.parse), Number(match[1]));
          }),
        );
      }

      function updateDistribution() {
        const counts = state.cases.reduce(
          (summary, item) => {
            summary[item.response] = (summary[item.response] ?? 0) + 1;
            return summary;
          },
          {},
        );
        const yes = counts.yes ?? 0;
        const no = counts.no ?? 0;
        const total = state.cases.length;
        const yesPercent = total ? (yes / total) * 100 : 0;

        distributionTotal.textContent = `${total} cases`;
        yesBar.style.width = `${yesPercent}%`;
        noBar.style.width = `${Math.max(0, 100 - yesPercent)}%`;
        yesLegend.textContent = `Yes ${yes}`;
        noLegend.textContent = `No ${no}`;

        for (const button of filterButtons) {
          const filter = button.dataset.responseFilter;
          const count = filter === "all" ? total : counts[filter] ?? 0;
          button.querySelector("[data-filter-count]").textContent = count;
        }
      }

      function getVisibleCases() {
        return state.cases.filter((item) => {
          const matchesResponse = state.response === "all" || item.response === state.response;
          const matchesQuery = !state.query || item.prompt.toLowerCase().includes(state.query);
          return matchesResponse && matchesQuery;
        });
      }

      function renderMetadata(item) {
        const rawResponse = item.raw ? JSON.stringify(item.raw, null, 2) : "—";
        return `
          <details class="metadata">
            <summary>Technical details</summary>
            <dl class="metadata-grid">
              <div><dt>Model</dt><dd>${escapeHtml(item.model)}</dd></div>
              <div><dt>System prompt</dt><dd>${escapeHtml(item.systemPrompt)}</dd></div>
              <div><dt>Finish reason</dt><dd>${escapeHtml(item.finishReason)}</dd></div>
              <div><dt>Usage</dt><dd>${escapeHtml(item.totalTokens ?? "—")} tokens · ${escapeHtml(formatCost(item.cost))}</dd></div>
            </dl>
            <details class="raw-response">
              <summary>Raw API response</summary>
              <pre>${escapeHtml(rawResponse)}</pre>
            </details>
          </details>
        `;
      }

      function renderCase(item) {
        const answerClass = item.response === "no" ? "response-value--no" : "response-value--yes";
        const answer = item.response || "unknown";
        return `
          <article class="case-row">
            <div class="case-id">#${String(item.id).padStart(2, "0")}</div>
            <div class="case-content">
              <p class="case-label">Question</p>
              <p class="prompt-text">${escapeHtml(item.prompt)}</p>
              ${renderMetadata(item)}
            </div>
            <div class="response-column">
              <span class="response-label">Response</span>
              <strong class="response-value ${answerClass}">${escapeHtml(answer)}</strong>
            </div>
          </article>
        `;
      }

      function renderCases() {
        const visibleCases = getVisibleCases();
        resultMeta.textContent = `Showing ${visibleCases.length} of ${state.cases.length} cases`;
        if (!visibleCases.length) {
          results.innerHTML = '<div class="empty-state"><h2>No matching cases</h2><p>Try a different prompt or response.</p></div>';
          return;
        }
        results.innerHTML = visibleCases.map(renderCase).join("");
      }

      function showLoadError() {
        resultMeta.textContent = "Results are not loaded";
        results.innerHTML = `
          <div class="empty-state">
            <h2>Could not load the result files</h2>
            <p>Serve the repository root, then open <code>/visualizer/</code>.</p>
            <code>python3 -m http.server 8000</code>
            <label class="file-picker">
              Load JSON files
              <input id="fileInput" type="file" accept="application/json" multiple webkitdirectory />
            </label>
          </div>
        `;
        document.getElementById("fileInput").addEventListener("change", async (event) => {
          try {
            state.cases = await loadFromFiles(event.target.files);
            updateDistribution();
            renderCases();
          } catch (error) {
            results.querySelector(".empty-state p").textContent = "The selected files are not valid result files.";
          }
        });
      }

      searchInput.addEventListener("input", (event) => {
        state.query = event.target.value.trim().toLowerCase();
        renderCases();
      });

      for (const button of filterButtons) {
        button.addEventListener("click", () => {
          state.response = button.dataset.responseFilter;
          for (const otherButton of filterButtons) {
            otherButton.setAttribute("aria-pressed", String(otherButton === button));
          }
          renderCases();
        });
      }

      loadFromRepository()
        .then((loadedCases) => {
          state.cases = loadedCases;
          updateDistribution();
          renderCases();
        })
        .catch(showLoadError);
    </script>
  </body>
</html>
